name: build

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$SDK/cmdline-tools" -type f -path "*/bin/sdkmanager" 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKM" ]; then
            echo "sdkmanager not found under $SDK" >&2
            exit 1
          fi
          echo "using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            CODE="${GITHUB_REF_NAME%%-*}"
            NAME="${GITHUB_REF_NAME#*-}"
          else
            source version.env
            CODE="$VERSION_CODE"
            NAME="$VERSION_NAME"
          fi
          [[ "$CODE" =~ ^[0-9]+$ ]] || { echo "invalid version code: $CODE"; exit 1; }
          [[ -n "$NAME" && "$NAME" != "$CODE" ]] || { echo "invalid version name: $NAME"; exit 1; }
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$SDK/build-tools/34.0.0"
          AJ="$SDK/platforms/android-34/android.jar"
          rm -rf build
          mkdir -p build/stubs build/classes build/dex
          javac -nowarn -source 11 -target 11 -cp "$AJ" -d build/stubs $(find compat/stubs -name '*.java')
          javac -nowarn -source 11 -target 11 -cp "$AJ:build/stubs" -d build/classes $(find app/src/main/java -name '*.java')
          "$BT/aapt2" compile --dir app/src/main/res -o build/res.zip
          java -cp "$BT/lib/d8.jar" com.android.tools.r8.D8 --release --min-api 26 --lib "$AJ" --output build/dex $(find build/classes -name '*.class')
          "$BT/aapt2" link -o build/base.apk -I "$AJ" \
            --manifest app/src/main/AndroidManifest.xml \
            -A app/src/main/assets \
            --min-sdk-version 26 --target-sdk-version 34 \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            build/res.zip
          cp build/base.apk build/unsigned.apk
          (cd build/dex && zip -q -j ../unsigned.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools/34.0.0"
          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            java -jar "$BT/lib/apksigner.jar" sign \
              --ks "$RUNNER_TEMP/keystore.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --out build/Edgefluiddl.apk build/aligned.apk
          else
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "tag build requires signing secrets (KEYSTORE_BASE64, KEY_ALIAS, ...)" >&2
              exit 1
            fi
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.jks" -storetype JKS \
              -alias module -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Edgefluiddl CI" > /dev/null 2>&1
            java -jar "$BT/lib/apksigner.jar" sign \
              --ks "$RUNNER_TEMP/debug.jks" --ks-pass pass:android --key-pass pass:android \
              --out build/Edgefluiddl.apk build/aligned.apk
            echo "::warning::signing secrets missing, APK is signed with a temporary debug key"
          fi

      - name: Verify
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools/34.0.0"
          java -jar "$BT/lib/apksigner.jar" verify -v --print-certs build/Edgefluiddl.apk
          "$BT/aapt2" dump badging build/Edgefluiddl.apk > build/badging.txt
          head -n 1 build/badging.txt
          grep -q "name='io.github.luoyu1337.edgefluiddl'" build/badging.txt || { echo "package name mismatch"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Edgefluiddl
          path: build/Edgefluiddl.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Edgefluiddl
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Edgefluiddl.apk
          generate_release_notes: true
